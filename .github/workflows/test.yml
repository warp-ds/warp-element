name: Run Lint and Tests

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - run: npm clean-install
      - run: npm run lint
      - run: npm run types
      - run: npm run build
